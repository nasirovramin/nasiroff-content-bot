name: LinkedIn Debug

on:
  push:
    paths:
      - "linkedin-debug-trigger.txt"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for Cloudflare deploy
        run: sleep 90
      - name: LinkedIn status
        run: |
          set -euxo pipefail
          curl --fail --show-error --silent "https://nasiroff-content-bot.nasirovramin.workers.dev/debug/linkedin-latest-4c8e7a"
