name: One-time KREADIV short-link smoke test
on:
  push:
    branches: ['gh-pages']
    paths:
      - '.github/workflows/shortlink-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify short code resolver and readable article
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse
          code="1Dw4VOEbQb"
          domain="https://jpspagptdbytagimmesp.supabase.co/functions/v1/"
          with urllib.request.urlopen(domain+"kreadiv-shortlinks?s="+code,timeout=20) as r:
              data=json.load(r)
              print("SHORTCODE_STATUS",r.status,data.get("ok"),data.get("article","")[:65])
              assert r.status==200 and data["ok"] is True
              assert data["article"].startswith("https://telegra.ph/")
          article=urllib.parse.quote(data["article"],safe="")
          with urllib.request.urlopen(domain+"kreadiv-reader?format=json&article="+article,timeout=20) as r:
              post=json.load(r)
              print("ARTICLE_STATUS",r.status,post.get("ok"),post.get("title","")[:70])
              assert r.status==200 and post.get("ok") is True
          with urllib.request.urlopen("https://nasirovramin.github.io/nasiroff-content-bot/?s="+code,timeout=20) as r:
              page=r.read().decode("utf-8")
              print("GITHUB_PAGES_STATUS",r.status,"supports_s", "const shortCode=search.get(\"s\")" in page)
              assert r.status==200 and 'const shortCode=search.get("s")' in page
          PY
