name: Validate Worker

on:
  push:
    branches:
      - main.ru
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx wrangler deploy --dry-run
      - name: Check rendered editor JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('src/index.js','utf8');
          const route=src.indexOf('if (url.pathname === "/edit/dord-baxis")');
          const marker='const html = `';
          const tplStart=src.indexOf(marker, route);
          const tplBodyStart=tplStart+marker.length;
          const tplEnd=src.indexOf('`;\n\n        return new Response(html', tplBodyStart);
          if(route<0||tplStart<0||tplEnd<0) throw new Error('editor template not found');
          const raw=src.slice(tplBodyStart,tplEnd);
          const render=new Function('ARTICLE_TITLE','articleUrl','apiUrl','mediaApiUrl','BUILD_VERSION','return `'+raw+'`;');
          const html=render('Title','https://example.com/article','https://example.com/api','https://example.com/media','test');
          const s=html.indexOf('<script>');
          const e=html.indexOf('</script>',s);
          if(s<0||e<0) throw new Error('rendered editor script not found');
          fs.writeFileSync('/tmp/editor-rendered.js',html.slice(s+8,e));
          NODE
          node --check /tmp/editor-rendered.js
