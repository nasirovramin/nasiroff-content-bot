name: Live Worker Smoke Test

on:
  push:
    branches:
      - main.ru
    paths:
      - ".github/workflows/live-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check root
        run: |
          set -euxo pipefail
          curl -i --fail --show-error --silent "https://nasiroff-content-bot.nasirovramin.workers.dev/" | tee /tmp/root.txt
          grep -q "nasiroff_content_bot is running" /tmp/root.txt
      - name: Check article
        run: |
          set -euxo pipefail
          curl -i --fail --show-error --silent "https://nasiroff-content-bot.nasirovramin.workers.dev/article/dord-baxis" | tee /tmp/article.txt
          grep -q "Bir layihəyə dörd fərqli baxış" /tmp/article.txt
      - name: Check LinkedIn debug
        run: |
          set -euxo pipefail
          curl --fail --show-error --silent "https://nasiroff-content-bot.nasirovramin.workers.dev/debug/linkedin-latest-4c8e7a" | tee /tmp/linkedin-debug.json
          cat /tmp/linkedin-debug.json
      - name: Retry latest LinkedIn post
        continue-on-error: true
        run: |
          set -euxo pipefail
          curl --show-error --silent -i "https://nasiroff-content-bot.nasirovramin.workers.dev/retry-linkedin-latest-6a2f91" | tee /tmp/linkedin-retry.txt
          cat /tmp/linkedin-retry.txt
      - name: Check new CMS build marker
        continue-on-error: true
        run: |
          set -euxo pipefail
          curl --fail --show-error --silent "https://nasiroff-content-bot.nasirovramin.workers.dev/article/dord-baxis" | grep -q "video"
      - name: Check latest Worker build
        run: |
          set -euxo pipefail
          for i in {1..12}; do
            V="$(curl --fail --show-error --silent "https://nasiroff-content-bot.nasirovramin.workers.dev/version" || true)"
            echo "version=$V"
            if [ "$V" = "telegram-archive-through-2025" ]; then exit 0; fi
            sleep 10
          done
          exit 1
