name: Live Worker Smoke Test

on:
  push:
    branches:
      - main.ru
    paths:
      - ".github/workflows/live-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check root
        run: |
          set -euxo pipefail
          curl --fail --show-error --silent "https://nasiroff-content-bot.nasirovramin.workers.dev/" | grep -q "nasiroff_content_bot is running"
      - name: Check latest build
        run: |
          set -euxo pipefail
          for i in {1..18}; do
            V="$(curl --fail --show-error --silent "https://nasiroff-content-bot.nasirovramin.workers.dev/version" || true)"
            echo "version=$V"
            if [ "$V" = "long-translation-timeout-fix" ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Check Gemini health
        run: |
          set -euxo pipefail
          curl --fail --show-error --silent "https://nasiroff-content-bot.nasirovramin.workers.dev/health/gemini" | tee /tmp/gemini-health.json
          cat /tmp/gemini-health.json
